name: CI

permissions: read-all

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # The full known-answer sweep. Per-PR runs drop the `slow_kat`-tagged suites
  # (see .bazelrc.ci); this run puts them back, so an exhaustive sweep across
  # every parameter set runs daily rather than never.
  schedule:
    - cron: "0 17 * * *"
  # Re-running a run replays the matrix the `setup` job produced at the time, so
  # a change to `HAS_GPU_RUNNER` or a runner coming back online needs a fresh
  # run rather than a rerun. Without this, that means an empty commit.
  workflow_dispatch:

# Cancel in-progress runs for PRs (same head branch), but never cancel pushes
# to main so that every merge gets a full CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runners are labelled by capability, not by role — a CPU box is
# `[self-hosted, cpu]` and a GPU box is `[self-hosted, gpu]` — so each leg lands
# on a box advertising what it needs and the CPU leg never starves behind a busy
# GPU box.
#
# The matrix is built by a job rather than written statically, which is the
# opposite of `hash-frx`'s shape and needs its reason stated. `hash-frx` has GPU
# runner access and requires its GPU leg, so a static entry is right there: a
# leg a variable can make absent can never be a required check, since branch
# protection waits forever on a context that never reports.
#
# This repo has no GPU runner access. A static entry would put a job on every
# pull request that no runner picks up — permanently queued, which reads as
# "still running" rather than as "not configured". So the leg is gated on
# `HAS_GPU_RUNNER` and is absent until access exists, and correspondingly is not
# a required check. When access is granted, this becomes a static matrix and the
# context joins branch protection. (A job-level `if` cannot read `matrix`, hence
# a job rather than a condition.)
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      tag_filters: ${{ steps.set.outputs.tag_filters }}
    steps:
      - id: set
        run: |
          # One `flags` bag per leg, so the test step has no shell branch. The
          # CPU leg executes on the Buildbarn pool (`--config=remote`, see
          # //.bazelrc.rbe) with machine-local mTLS material. The pool is
          # CPU-only, so the GPU leg executes locally and passes no remote
          # flags; `cuda` is strict — no cpu fallback — so a green leg really
          # ran on the device, and preallocation is off because bazel runs test
          # actions concurrently against that one device and each process would
          # otherwise claim most of its memory.
          rbe='--config=remote --tls_certificate=/etc/rbe-certs/ca.pem --tls_client_certificate=/etc/rbe-certs/client.pem --tls_client_key=/etc/rbe-certs/client.key'
          cpu='{"backend":"cpu","runs_on":["self-hosted","cpu"],"frx_platforms":"cpu","flags":"'"${rbe}"'"}'
          gpu='{"backend":"gpu","runs_on":["self-hosted","gpu"],"frx_platforms":"cuda","flags":"--test_env=XLA_PYTHON_CLIENT_PREALLOCATE=false"}'
          include="${cpu}"
          if [ "${{ vars.HAS_GPU_RUNNER }}" = "true" ]; then
            include="${cpu},${gpu}"
          fi
          echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"
          # A CLI --test_tag_filters *replaces* .bazelrc.ci's, so passing an
          # empty one is how the scheduled sweep drops the `slow_kat` exclusion
          # and runs everything. Empty string on a PR run, which leaves
          # .bazelrc.ci's default in place.
          tag_filters=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tag_filters="--test_tag_filters="
          fi
          echo "tag_filters=${tag_filters}" >> "$GITHUB_OUTPUT"

  build-and-test:
    # Explicit name; else GitHub appends every matrix value (incl. the long
    # --config=remote + cert-path rbe flags) to the auto-generated job name.
    name: build-and-test (${{ matrix.backend }})
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      # No setup-bazel: it clobbers the box's ~/.bazelrc (self-hosted runners
      # already persist bazel + caches). `.bazelrc.ci` is passed explicitly
      # because it is not auto-imported — it drops the slow sweeps a PR doesn't
      # need.
      - name: Run bazel test
        run: |
          set -euo pipefail
          bazel --bazelrc=.bazelrc.ci test ${{ matrix.flags }} \
            ${{ needs.setup.outputs.tag_filters }} \
            --test_env=FRX_PLATFORMS=${{ matrix.frx_platforms }} -- //...

      # Capture the runner-local test.log a failed test leaves behind — the CI
      # stream only carries the FAIL summary, not the test output.
      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main
        with:
          name: bazel-test-logs-${{ matrix.backend }}

  pre-commit:
    # The pin-bump PRs are authored by this account; their generated diffs are
    # already formatted and their subjects are not written to the convention.
    if: github.actor != 'fractalyze-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # --all-files rather than a diff range: the tree is small enough that the
      # whole-repo run is cheap, and it catches a violation that arrives in a
      # file the PR did not touch (a hook version bump, a new rule).
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files
