name: CI

permissions: read-all

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Puts back the `slow_kat` suites .bazelrc.ci drops per PR.
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

# Cancel in-progress runs for PRs (same head branch), but never cancel pushes
# to main so that every merge gets a full CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Two legs, and both are required. The CPU leg checks the schemes against
  # their published vectors; the GPU leg is what the batch-throughput claims
  # rest on — AES-GCM and ML-KEM promise batch performance on a GPU, and a
  # fusion marker that stops being recognized still produces the right bytes
  # on CPU. Runners are labelled by capability, not role: a CPU box is
  # `[self-hosted, cpu]`, a GPU box `[self-hosted, gpu]`, so each leg lands on
  # a box that advertises what it needs.
  #
  # The matrix is static: both legs run on every pull request. Gating the GPU
  # leg on a repo variable would turn a required check into one that never
  # reports, which leaves pull requests pending forever rather than red (#27
  # retired the gated form once a GPU runner served this repo).
  build-and-test:
    # Explicit name; else GitHub appends every matrix value (incl. the long
    # --config=remote + cert-path rbe flags) to the auto-generated job name.
    name: build-and-test (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CPU leg executes on the Buildbarn pool (`--config=remote`);
          # the mTLS client material is machine-local, so the paths point at
          # the runner's own /etc/rbe-certs.
          - backend: cpu
            runs_on: [self-hosted, cpu]
            frx_platforms: cpu
            flags: >-
              --config=remote
              --tls_certificate=/etc/rbe-certs/ca.pem
              --tls_client_certificate=/etc/rbe-certs/client.pem
              --tls_client_key=/etc/rbe-certs/client.key
          # The pool is CPU-only, so the GPU leg runs local with no remote
          # flags; strict `cuda` (no cpu fallback) proves a green leg ran on
          # the device, and prealloc is off because bazel runs test actions
          # concurrently against the one device.
          - backend: gpu
            runs_on: [self-hosted, gpu]
            frx_platforms: cuda
            flags: --test_env=XLA_PYTHON_CLIENT_PREALLOCATE=false
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      # No setup-bazel: it clobbers the box's ~/.bazelrc (self-hosted runners
      # already persist bazel + caches). `.bazelrc.ci` is not auto-imported.
      #
      # The scheduled sweep passes an empty --test_tag_filters because a CLI
      # value *replaces* .bazelrc.ci's — an empty one is how the sweep drops
      # the `slow_kat` exclusion.
      - name: Run bazel test
        run: |
          set -euo pipefail
          bazel --bazelrc=.bazelrc.ci test ${{ matrix.flags }} \
            ${{ github.event_name == 'schedule' && '--test_tag_filters=' || '' }} \
            --test_env=FRX_PLATFORMS=${{ matrix.frx_platforms }} -- //...

      # Capture the runner-local test.log a failed test leaves behind — the CI
      # stream only carries the FAIL summary, not the test output.
      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main
        with:
          name: bazel-test-logs-${{ matrix.backend }}

  pre-commit:
    if: github.actor != 'fractalyze-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # --all-files rather than a diff range: catches a violation arriving in a
      # file the PR did not touch (a hook version bump, a new rule).
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files
