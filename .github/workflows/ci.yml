name: CI

permissions: read-all

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Puts back the `slow_kat` suites .bazelrc.ci drops per PR.
  schedule:
    - cron: "0 17 * * *"
  # A rerun replays the matrix `setup` already produced, so a HAS_GPU_RUNNER
  # change needs a fresh run.
  workflow_dispatch:

# Cancel in-progress runs for PRs (same head branch), but never cancel pushes
# to main so that every merge gets a full CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runners are labelled by capability, not role: a CPU box is `[self-hosted, cpu]`,
# a GPU box `[self-hosted, gpu]`.
#
# No GPU runner serves this repo yet, so the GPU leg is gated on HAS_GPU_RUNNER
# and stays absent — a static entry would queue on every PR, which reads as
# "still running" rather than "not configured". A gated leg cannot be a required
# check; make the matrix static when access lands. (A job-level `if` can't read
# `matrix`, hence the setup job.)
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      tag_filters: ${{ steps.set.outputs.tag_filters }}
    steps:
      - id: set
        run: |
          # One `flags` bag per leg keeps the test step branch-free. The pool is
          # CPU-only, so the GPU leg runs local with no remote flags; strict
          # `cuda` (no cpu fallback) proves a green leg ran on the device, and
          # prealloc is off because bazel runs test actions concurrently against
          # the one device.
          rbe='--config=remote --tls_certificate=/etc/rbe-certs/ca.pem --tls_client_certificate=/etc/rbe-certs/client.pem --tls_client_key=/etc/rbe-certs/client.key'
          cpu='{"backend":"cpu","runs_on":["self-hosted","cpu"],"frx_platforms":"cpu","flags":"'"${rbe}"'"}'
          gpu='{"backend":"gpu","runs_on":["self-hosted","gpu"],"frx_platforms":"cuda","flags":"--test_env=XLA_PYTHON_CLIENT_PREALLOCATE=false"}'
          include="${cpu}"
          if [ "${{ vars.HAS_GPU_RUNNER }}" = "true" ]; then
            include="${cpu},${gpu}"
          fi
          echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"
          # A CLI --test_tag_filters *replaces* .bazelrc.ci's, so an empty one
          # is how the sweep drops the `slow_kat` exclusion.
          tag_filters=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tag_filters="--test_tag_filters="
          fi
          echo "tag_filters=${tag_filters}" >> "$GITHUB_OUTPUT"

  build-and-test:
    # Explicit name; else GitHub appends every matrix value (incl. the long
    # --config=remote + cert-path rbe flags) to the auto-generated job name.
    name: build-and-test (${{ matrix.backend }})
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      # No setup-bazel: it clobbers the box's ~/.bazelrc (self-hosted runners
      # already persist bazel + caches). `.bazelrc.ci` is not auto-imported.
      - name: Run bazel test
        run: |
          set -euo pipefail
          bazel --bazelrc=.bazelrc.ci test ${{ matrix.flags }} \
            ${{ needs.setup.outputs.tag_filters }} \
            --test_env=FRX_PLATFORMS=${{ matrix.frx_platforms }} -- //...

      # Capture the runner-local test.log a failed test leaves behind — the CI
      # stream only carries the FAIL summary, not the test output.
      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main
        with:
          name: bazel-test-logs-${{ matrix.backend }}

  pre-commit:
    if: github.actor != 'fractalyze-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # --all-files rather than a diff range: catches a violation arriving in a
      # file the PR did not touch (a hook version bump, a new rule).
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files
